name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - run: pip check
      - run: pytest -q
      - run: python -m compileall -q src scripts
      - run: python scripts/validate_experiment.py --config configs/experiments/exp001_fixed_budget.yaml
      - run: python scripts/validate_experiment.py --config configs/experiments/exp002_graph_aggregation.yaml
      - run: python scripts/validate_experiment.py --config configs/experiments/exp003_execution_feedback.yaml
      - run: python scripts/validate_experiment.py --config configs/default.yaml --allow-mock
      - run: python scripts/run_experiment.py --config configs/default.yaml --mock

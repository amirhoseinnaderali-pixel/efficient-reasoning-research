name: EXP-001 Materialization Audit (temporary)

on:
  push:

permissions:
  contents: write

jobs:
  audit:
    if: !contains(github.event.head_commit.message, 'data: materialize frozen EXP-001 benchmark')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyYAML pytest

      - name: Materialize frozen EXP-001 benchmark
        run: |
          PYTHONPATH=src python scripts/materialize_exp001_benchmark.py \
            --manifest benchmarks/manifests/exp001_v1.json \
            --output benchmarks/programming/exp001_v1/tasks.jsonl

      - name: Verify frozen benchmark
        run: |
          PYTHONPATH=src python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from efficient_reasoning.experiments.readiness import validate_frozen_manifest, validate_materialized_benchmark
          from efficient_reasoning.benchmarks.loader import load_tasks

          manifest_path = Path("benchmarks/manifests/exp001_v1.json")
          tasks_path = Path("benchmarks/programming/exp001_v1/tasks.jsonl")
          manifest = validate_frozen_manifest(manifest_path)
          validate_materialized_benchmark(manifest, tasks_path)
          tasks = load_tasks(tasks_path)
          assert len(tasks) == manifest["task_count"] == 100
          assert [t["id"] for t in tasks] == [x["task_id"] for x in manifest["tasks"]]
          assert all(len(t["tests"]["visible"]["assertions"]) + len(t["tests"]["hidden"]["assertions"]) >= 2 for t in tasks)
          print("TASK_COUNT:", len(tasks))
          print("TASK_ORDER_MATCH: true")
          print("TASK_HASHES_VALIDATED: true")
          print("TEST_HASHES_VALIDATED: true")
          print("PROVENANCE_VALIDATED: true")
          print("VISIBLE_HIDDEN_SPLITS_VALIDATED: true")
          print("MANIFEST_SHA256:", hashlib.sha256(manifest_path.read_bytes()).hexdigest())
          print("MATERIALIZED_SHA256:", hashlib.sha256(tasks_path.read_bytes()).hexdigest())
          print("SOURCE_COMMIT:", manifest["provenance"]["source_commit"])
          print("SOURCE_ARCHIVE_SHA256:", manifest["provenance"]["source_archive_sha256"])
          PY

      - name: Commit materialized benchmark
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/programming/exp001_v1/tasks.jsonl
          if git diff --cached --quiet; then
            echo "BENCHMARK_COMMIT_NEEDED: false"
          else
            git commit -m "data: materialize frozen EXP-001 benchmark"
            git push origin HEAD:main
          fi

      - name: Static/scientific tests
        run: |
          PYTHONPATH=src python -m pytest -q
          PYTHONPATH=src python -m compileall -q src scripts
          PYTHONPATH=src python scripts/validate_experiment.py --config configs/experiments/exp001_fixed_budget.yaml

      - name: Readiness gate
        id: readiness
        continue-on-error: true
        run: PYTHONPATH=src python scripts/validate_readiness.py

      - name: Execution environment gate
        id: environment
        continue-on-error: true
        run: PYTHONPATH=src python scripts/validate_execution_environment.py

      - name: Real-model/Docker smoke test
        id: smoke
        continue-on-error: true
        run: PYTHONPATH=src python scripts/run_execution_smoke_test.py

      - name: Final summary
        if: always()
        run: |
          echo "READINESS_OUTCOME: ${{ steps.readiness.outcome }}"
          echo "EXECUTION_ENVIRONMENT_OUTCOME: ${{ steps.environment.outcome }}"
          echo "SMOKE_TEST_OUTCOME: ${{ steps.smoke.outcome }}"
          echo "EXP001_EXECUTED: false"

      - name: Remove temporary workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/exp001_materialize_audit.yml
          git add -A
          git commit -m "chore: remove temporary EXP-001 materialization audit workflow"
          git push origin HEAD:main

name: Final EXP001 Audit 2 (temporary)
on:
  push:
    branches:
      - tmp/final-exp001-audit-2-20261002
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Materialize frozen benchmark
        run: PYTHONPATH=src python scripts/materialize_exp001_benchmark.py --manifest benchmarks/manifests/exp001_v1.json --output benchmarks/programming/exp001_v1/tasks.jsonl
      - name: Verify frozen benchmark
        run: |
          PYTHONPATH=src python - <<'PY'
          import hashlib
          from pathlib import Path
          from efficient_reasoning.experiments.readiness import validate_frozen_manifest, validate_materialized_benchmark
          from efficient_reasoning.benchmarks.loader import load_tasks
          mp=Path('benchmarks/manifests/exp001_v1.json'); tp=Path('benchmarks/programming/exp001_v1/tasks.jsonl')
          m=validate_frozen_manifest(mp); validate_materialized_benchmark(m,tp); ts=load_tasks(tp)
          assert len(ts)==100
          assert [t['id'] for t in ts]==[x['task_id'] for x in m['tasks']]
          print('TASK_COUNT:',len(ts)); print('TASK_ORDER_MATCH: true')
          print('TASK_HASHES_VALIDATED: true'); print('TEST_HASHES_VALIDATED: true')
          print('PROVENANCE_VALIDATED: true'); print('VISIBLE_HIDDEN_SPLITS_VALIDATED: true')
          print('MANIFEST_CONTENT_SHA256:',m['integrity']['manifest_content_sha256'])
          print('MATERIALIZED_SHA256:',hashlib.sha256(tp.read_bytes()).hexdigest())
          print('SOURCE_COMMIT:',m['provenance']['source_commit'])
          print('SOURCE_ARCHIVE_SHA256:',m['provenance']['source_archive_sha256'])
          print('FIRST_TASK:',ts[0]['id']); print('LAST_TASK:',ts[-1]['id'])
          PY
      - name: Persist benchmark in audit branch
        run: |
          git config user.name "EXP-001 Audit"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/programming/exp001_v1/tasks.jsonl
          git diff --cached --check
          git commit -m "data: materialize frozen EXP-001 benchmark"
          git push origin HEAD:tmp/final-exp001-audit-2-20261002
      - name: Static tests
        run: |
          PYTHONPATH=src python -m pytest -q
          PYTHONPATH=src python -m compileall -q src scripts
          PYTHONPATH=src python scripts/validate_experiment.py --config configs/experiments/exp001_fixed_budget.yaml
      - name: Clean generated metadata
        run: rm -rf src/efficient_reasoning_research.egg-info
      - name: Readiness
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: PYTHONPATH=src python scripts/validate_readiness.py
      - name: Execution environment
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: PYTHONPATH=src python scripts/validate_execution_environment.py
      - name: Real one-task smoke
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: PYTHONPATH=src python scripts/run_execution_smoke_test.py

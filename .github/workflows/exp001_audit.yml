name: EXP-001 Audit (temporary)

on:
  push:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip check

      - name: Materialize frozen EXP-001 benchmark
        id: materialize
        continue-on-error: true
        run: |
          python scripts/materialize_exp001_benchmark.py \
            --manifest benchmarks/manifests/exp001_v1.json \
            --output benchmarks/programming/exp001_v1/tasks.jsonl

      - name: Diagnose pinned benchmark provenance
        run: |
          python - <<'PY'
          import gzip
          import hashlib
          import json
          import urllib.request
          import sys
          from pathlib import Path
          sys.path.insert(0, "src")
          from efficient_reasoning.benchmarks.exp001 import canonical_task_hash, test_source_hash

          manifest = json.loads(Path("benchmarks/manifests/exp001_v1.json").read_text())
          p = manifest["provenance"]
          url = f"https://raw.githubusercontent.com/openai/human-eval/{p['source_commit']}/{p['source_path']}"
          req = urllib.request.Request(url, headers={"User-Agent": "efficient-reasoning-research/1.0"})
          with urllib.request.urlopen(req, timeout=30) as resp:
              archive = resp.read()
          rows = [json.loads(x) for x in gzip.decompress(archive).decode("utf-8").splitlines() if x.strip()]
          first = next(x for x in rows if x["task_id"] == "HumanEval/0")
          expected = manifest["tasks"][0]
          print("OFFICIAL_SOURCE_URL:", url)
          print("OFFICIAL_ARCHIVE_SHA256_ACTUAL:", hashlib.sha256(archive).hexdigest())
          print("OFFICIAL_ARCHIVE_SHA256_EXPECTED:", p["source_archive_sha256"])
          print("OFFICIAL_ROW_COUNT:", len(rows))
          print("HUMANEVAL_0_TASK_SHA256_ACTUAL:", canonical_task_hash(first))
          print("HUMANEVAL_0_TASK_SHA256_EXPECTED:", expected["task_sha256"])
          print("HUMANEVAL_0_TEST_SHA256_ACTUAL:", test_source_hash(first["test"]))
          print("HUMANEVAL_0_TEST_SHA256_EXPECTED:", expected["test_sha256"])

          mirror_url = "https://raw.githubusercontent.com/nerdskingcom/gguf-humaneval-benchmark/7e5a3ceb7b8ab4d94714098fad566ef4c487a605/HumanEval.jsonl"
          with urllib.request.urlopen(mirror_url, timeout=30) as resp:
              mirror_bytes = resp.read()
          mirror_lines = [json.loads(x) for x in mirror_bytes.decode("utf-8").splitlines() if x.strip()]
          mirror_first = next(x for x in mirror_lines if x["task_id"] == "HumanEval/0")
          print("MIRROR_FILE_SHA256_ACTUAL:", hashlib.sha256(mirror_bytes).hexdigest())
          print("MIRROR_FILE_SHA256_EXPECTED:", p["acquisition_mirror"]["file_sha256"])
          print("MIRROR_TASK_SHA256:", canonical_task_hash(mirror_first))
          print("MIRROR_TEST_SHA256:", test_source_hash(mirror_first["test"]))
          PY

      - name: Readiness gate
        continue-on-error: true
        run: python scripts/validate_readiness.py

      - name: Execution environment gate
        continue-on-error: true
        run: python scripts/validate_execution_environment.py

      - name: One-task isolated execution smoke test
        continue-on-error: true
        run: python scripts/run_execution_smoke_test.py

      - name: Scientific pre-execution invariant tests
        run: |
          python -m pytest -q
          python -m compileall -q src scripts
          python scripts/validate_experiment.py --config configs/experiments/exp001_fixed_budget.yaml

      - name: Final audit summary
        if: always()
        run: |
          echo "AUDIT_COMPLETED"
          echo "EXP001_EXECUTED: false"

      - name: Remove temporary audit workflow and push final state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/exp001_audit.yml
          git add -A
          git commit -m "chore: remove temporary EXP-001 audit workflow"
          git push origin HEAD:main

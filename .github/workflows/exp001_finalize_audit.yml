name: EXP-001 Final Audit (temporary)

on:
  push:

permissions:
  contents: write

jobs:
  finalize-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyYAML pytest

      - name: Diagnose frozen HumanEval task hash
        run: |
          PYTHONPATH=src python - <<'PY'
          import gzip, hashlib, json, urllib.request
          from efficient_reasoning.benchmarks.exp001 import canonical_task_hash
          manifest=json.load(open("benchmarks/manifests/exp001_v1.json"))
          p=manifest["provenance"]
          req=urllib.request.Request(
              f"https://raw.githubusercontent.com/openai/human-eval/{p['source_commit']}/{p['source_path']}",
              headers={"User-Agent":"efficient-reasoning-research/1.0"},
          )
          with urllib.request.urlopen(req, timeout=30) as resp:
              archive=resp.read()
          row=next(
              json.loads(line) for line in gzip.decompress(archive).decode("utf-8").splitlines()
              if json.loads(line)["task_id"] == "HumanEval/0"
          )
          expected=manifest["tasks"][0]["task_sha256"]
          payload={"task_id":row["task_id"],"prompt":row["prompt"],"entry_point":row["entry_point"]}
          print("EXPECTED:", expected)
          print("CURRENT_FUNCTION:", canonical_task_hash(row))
          print("DEFAULT:", hashlib.sha256(json.dumps(payload).encode("utf-8")).hexdigest())
          print("COMPACT:", hashlib.sha256(json.dumps(payload,separators=(',',':')).encode("utf-8")).hexdigest())
          print("SORTED_COMPACT:", hashlib.sha256(json.dumps(payload,sort_keys=True,separators=(',',':')).encode("utf-8")).hexdigest())
          print("PROMPT_RSTRIP_COMPACT:", hashlib.sha256(json.dumps({**payload,'prompt':row['prompt'].rstrip()},separators=(',',':')).encode("utf-8")).hexdigest())
          print("PROMPT_STRIP_COMPACT:", hashlib.sha256(json.dumps({**payload,'prompt':row['prompt'].strip()},separators=(',',':')).encode("utf-8")).hexdigest())
          print("PROMPT_LF_COMPACT:", hashlib.sha256(json.dumps({**payload,'prompt':row['prompt'].replace('\r\n','\n').replace('\r','\n')},separators=(',',':')).encode("utf-8")).hexdigest())
          print("WITH_SOURCE_VERSION_COMPACT:", hashlib.sha256(json.dumps({**payload,'source_version':p['source_commit']},separators=(',',':')).encode("utf-8")).hexdigest())
          print("TEST_SHA:", hashlib.sha256(row["test"].encode("utf-8")).hexdigest())
          print("PROMPT_REPR:", repr(row["prompt"]))
          PY

      - name: Materialize frozen EXP-001 benchmark
        id: materialize
        continue-on-error: true
        run: |
          PYTHONPATH=src python scripts/materialize_exp001_benchmark.py \
            --manifest benchmarks/manifests/exp001_v1.json \
            --output benchmarks/programming/exp001_v1/tasks.jsonl

      - name: Verify frozen benchmark integrity
        if: steps.materialize.outcome == 'success'
        run: |
          PYTHONPATH=src python - <<'PY'
          import hashlib
          from pathlib import Path
          from efficient_reasoning.experiments.readiness import validate_frozen_manifest, validate_materialized_benchmark
          from efficient_reasoning.benchmarks.loader import load_tasks
          manifest_path=Path("benchmarks/manifests/exp001_v1.json")
          tasks_path=Path("benchmarks/programming/exp001_v1/tasks.jsonl")
          manifest=validate_frozen_manifest(manifest_path)
          validate_materialized_benchmark(manifest,tasks_path)
          tasks=load_tasks(tasks_path)
          ids=[t["id"] for t in tasks]
          assert ids == [x["task_id"] for x in manifest["tasks"]]
          print("TASK_COUNT:", len(tasks))
          print("TASK_ORDER_MATCH: true")
          print("TASK_HASHES_VALIDATED: true")
          print("TEST_HASHES_VALIDATED: true")
          print("PROVENANCE_VALIDATED: true")
          print("VISIBLE_HIDDEN_SPLITS_VALIDATED: true")
          print("MANIFEST_SHA256:", hashlib.sha256(manifest_path.read_bytes()).hexdigest())
          print("MATERIALIZED_SHA256:", hashlib.sha256(tasks_path.read_bytes()).hexdigest())
          PY

      - name: Commit materialized benchmark
        if: steps.materialize.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/programming/exp001_v1/tasks.jsonl
          git commit -m "data: materialize frozen EXP-001 benchmark"

      - name: Static and scientific gates
        run: |
          PYTHONPATH=src python -m pytest -q
          PYTHONPATH=src python -m compileall -q src scripts
          PYTHONPATH=src python scripts/validate_experiment.py --config configs/experiments/exp001_fixed_budget.yaml

      - name: Runtime readiness gate
        id: readiness
        continue-on-error: true
        run: PYTHONPATH=src python scripts/validate_readiness.py

      - name: Execution environment gate
        id: environment
        continue-on-error: true
        run: PYTHONPATH=src python scripts/validate_execution_environment.py

      - name: One-task real execution smoke test
        id: smoke
        continue-on-error: true
        run: PYTHONPATH=src python scripts/run_execution_smoke_test.py

      - name: Summary
        if: always()
        run: |
          echo "MATERIALIZE_OUTCOME: ${{ steps.materialize.outcome }}"
          echo "READINESS_OUTCOME: ${{ steps.readiness.outcome }}"
          echo "EXECUTION_ENVIRONMENT_OUTCOME: ${{ steps.environment.outcome }}"
          echo "SMOKE_TEST_OUTCOME: ${{ steps.smoke.outcome }}"
          echo "EXP001_EXECUTED: false"

      - name: Remove temporary workflow
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/exp001_finalize_audit.yml
          git add -A
          git commit -m "chore: remove temporary EXP-001 final audit workflow"
          git push origin HEAD:main
